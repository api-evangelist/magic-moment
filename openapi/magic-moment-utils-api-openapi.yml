  description: 'Operations tagged utils across 4 of this provider''s published API definitions: magic-moment-call-integration-openapi.yml, magic-moment-hubspot-integration-openapi.yml, magic-moment-office-suite-integration-openapi.yml, magic-moment-salesforce-integration-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://call.magicmoment.co.jp/
- url: https://hubspot.magicmoment.co.jp/
- url: https://suite.magicmoment.co.jp/
- url: https://sfdc.magicmoment.co.jp/
tags:
- name: utils
paths:
