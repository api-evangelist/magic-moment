openapi: 3.2.0
info:
  description: 集計基盤連携API仕様
  title: 集計基盤連携アプリケーション Aggregate API
  version: 1.0.0
servers:
- url: https://report.magicmoment.co.jp/
tags:
- name: Aggregate
paths:
  /aggregate/playbook-phases:
    put:
      security:
      - accessToken: []
      tags:
      - Aggregate
      operationId: savePlaybookReport
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - startDate
              - endDate
              properties:
                endDate:
                  type: string
                  format: date
                startDate:
                  type: string
                  format: date
      summary: Save playbook report
      x-summary-source: derived
  /aggregate/playbook-phases/daily:
    put:
      security:
      - apiKey: []
      tags:
      - Aggregate
      operationId: saveDailyPlaybookReport
      responses:
        '200':
          description: OK
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - startDate
              - endDate
              properties:
                endDate:
                  type: string
                  format: date
                startDate:
                  type: string
                  format: date
      summary: Save daily playbook report
      x-summary-source: derived
components:
  securitySchemes:
    accessToken:
      type: apiKey
      name: x-access-token
      in: header
    apiKey:
      type: apiKey
      name: x-api-key
      in: header
