aid: magic-moment
name: Magic Moment
description: 'Magic Moment is a Tokyo-based AI sales-automation company whose platform
  captures real business facts from deals, emails, and calls and turns them into actionable
  insight for sales forecasting and execution. Its flagship products — Magic Moment
  Playbook and Playbook Capture — layer AI over existing CRM systems (Salesforce, HubSpot)
  through no-code bidirectional sync, plus a Revenue Platform performance model and
  the Magic Moment X managed service. The company is ISO/IEC 27001:2022 certified. It
  does not currently publish a public developer API, developer portal, or OpenAPI
  specification; CRM integration is delivered as no-code sync rather than a documented API.'
