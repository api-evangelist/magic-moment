aid: magic-moment
name: Magic Moment
description: Magic Moment is a Tokyo-based AI sales-automation company whose Magic Moment Playbook platform
  captures real business facts from deals, calls, email, and meetings and writes them back into Salesforce,
  HubSpot, and other CRMs as structured sales data. Products include Magic Moment Playbook (AI auto-recording
  SFA/CRM), Playbook Capture, MM Claw, the Revenue Platform performance-based demand service, and the
  Magic Moment X managed AI department. The company publishes a Playbook API for developers and partners
  (announced 2024-04-03, documented at developer.magicmoment.co.jp behind the product login) and serves
  five anonymous Swagger 2.0 contracts for its Playbook integration services on its production hosts —
  Salesforce, HubSpot, Office suite (Google Workspace / Microsoft 365), call integration (MiiTel, Zoom
  Phone), and the reporting/aggregation service. The company is ISO/IEC 27001:2022 certified and publishes
  an llms.txt.
